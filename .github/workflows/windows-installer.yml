name: Windows installer

on:
  # Installers are built only when someone starts this workflow by hand.
  # A push to the branch must not publish a release or tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.3,<7" pytest

      - name: Unit tests
        run: python -m pytest tests -q --tb=line

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Cache portable Blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.2.14-windows-x64.zip
          key: blender-4.2.14-windows-x64

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Smoke test installed program
        timeout-minutes: 40
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\smoke.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankExtract-Setup
          path: dist/installer/TankExtract-Setup-*.exe
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tankextract-v1.3.8
          name: TankExtract 1.3.8 Windows
          prerelease: true
          generate_release_notes: false
          body: |
            Windows 10/11 x64 安装包 1.3.8，仍是候选，不是验收版。不覆盖 1.0.0–1.3.7。
            默认桥端规则仍是 none。只有校正文件或 --junction-rule 才会把端点放到实测屋面。
            校正会保留校正前桥面高程，并标明不是源网格原值。
            不补未测栏杆和桥柱。圆管仍是 8/12 边。
            FBX 仍是 Phong/Lambert。3ds Max 脚本未在 Max 中运行。
          files: dist/installer/TankExtract-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
