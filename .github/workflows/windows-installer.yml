name: Windows installer

on:
  push:
    branches:
      - cursor/tank-osgb-extract-304d
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.3,<7" pytest

      - name: Unit tests
        run: python -m pytest tests -q --tb=line

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Cache portable Blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.2.14-windows-x64.zip
          key: blender-4.2.14-windows-x64

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Smoke test installed program
        timeout-minutes: 40
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\smoke.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankExtract-Setup
          path: dist/installer/TankExtract-Setup-*.exe
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tankextract-v1.2.0
          name: TankExtract 1.2.0 Windows
          prerelease: true
          generate_release_notes: false
          body: |
            Windows 10/11 x64 安装包 1.2.0。自带 Python、numpy、scipy、Pillow 和 Blender 4.2.14 LTS。
            不覆盖 tankextract-v1.0.0 和 tankextract-v1.1.0。默认 quality=budget，只降低大曲面分段；--quality full 保持 96 段。
          files: dist/installer/TankExtract-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
