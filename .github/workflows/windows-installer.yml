name: Windows installer

on:
  push:
    branches:
      - cursor/tank-osgb-extract-304d
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.3,<7" pytest

      - name: Unit tests
        run: python -m pytest tests -q --tb=line

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Cache portable Blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.2.14-windows-x64.zip
          key: blender-4.2.14-windows-x64

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Smoke test installed program
        timeout-minutes: 40
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\smoke.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankExtract-Setup
          path: dist/installer/TankExtract-Setup-*.exe
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tankextract-v1.3.2
          name: TankExtract 1.3.2 Windows
          prerelease: true
          generate_release_notes: false
          body: |
            Windows 10/11 x64 安装包 1.3.2，仍是候选，不是验收版。不覆盖 1.0.0–1.3.1。
            球罐判定在圆柱半径偏低时搜索邻近半径，并用原圆柱的竖向带顶作对照，避免把拱顶/锥顶判成球。
            加强圈只在断面拟合为圆时按测得直径做圆管，不用外伸量代替管径。
            走道端点写入是否接到已测罐顶平台；只进入罐壁半径内不算通过。
          files: dist/installer/TankExtract-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
